<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chinese Flashcards</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>汉</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=0.0.16" />
  </head>
  <body>
    <div class="page">
      <nav class="tab-nav" role="tablist" aria-label="App sections">
        <button class="tab-button is-active" id="tab-study" type="button" role="tab" aria-selected="true" aria-controls="study-panel" data-tab="study">Study</button>
        <button class="tab-button" id="tab-import" type="button" role="tab" aria-selected="false" aria-controls="import-panel" data-tab="import" tabindex="-1">Manage deck</button>
        <button class="tab-button" id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="settings-panel" data-tab="settings" tabindex="-1">Settings</button>
        <button class="tab-button" id="tab-account" type="button" role="tab" aria-selected="false" aria-controls="account-panel" data-tab="account" tabindex="-1">Account</button>
      </nav>

      <section class="tab-panel" id="import-panel" role="tabpanel" aria-labelledby="tab-import" hidden>
        <div id="manage-deck-view"></div>
      </section>

      <section class="tab-panel study-panel" id="study-panel" role="tabpanel" aria-labelledby="tab-study">
        <div id="study-view"></div>
      </section>

      <section class="tab-panel settings-panel" id="settings-panel" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <div id="settings-view"></div>
      </section>

      <section class="tab-panel account-panel" id="account-panel" role="tabpanel" aria-labelledby="tab-account" hidden>
        <div id="account-view"></div>
      </section>

      <div id="dialog-view"></div>
    </div>

    <footer class="app-meta">
      <span id="app-version">Version 0.0.16</span>
      <span aria-hidden="true">·</span>
      <span>Last updated <time datetime="2026-10-30">2026-10-30</time></span>
      <span aria-hidden="true">·</span>
      <button class="feedback-link" id="open-feedback-btn" type="button">Report a bug or send feedback</button>
    </footer>

    <script src="firebase-config.js?v=0.0.16"></script>
    <script type="module" src="app.js?v=0.0.16"></script>
  </body>
</html>
