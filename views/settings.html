        <section class="library">
          <h2 class="panel-title">Study settings</h2>
          <div class="settings-grid">
            <label class="field session-field">
              <span>Cards per session</span>
              <select id="session-size"></select>
            </label>
            <label class="field settings-field-wide">
              <span>Study steps</span>
              <select id="study-mode">
                <option value="three">3 steps: character, pinyin, meaning</option>
                <option value="two">2 steps: character, then pinyin + meaning</option>
              </select>
            </label>
            <label class="field settings-field-wide">
              <span>Auto-play pronunciation after revealing pinyin</span>
              <select id="autoplay-pronunciation">
                <option value="on">On</option>
                <option value="off">Off</option>
              </select>
            </label>
          </div>
        </section>
      </section>
