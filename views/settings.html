        <section class="library">
          <h2 class="panel-title">Study settings</h2>
          <div class="settings-grid">
            <div class="field session-field">
              <span>Cards per session</span>
              <div class="session-size-control">
                <input id="session-size" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 20" aria-label="Number of cards per session" />
                <button class="theme-option" id="session-size-all" type="button" aria-pressed="false">All</button>
              </div>
            </div>
            <div class="field settings-field-wide">
              <span>Study steps</span>
              <div class="theme-switch" role="group" aria-label="Study steps">
                <button class="theme-option" type="button" data-study-mode-option="three" aria-pressed="true">3 steps: character, pinyin, meaning</button>
                <button class="theme-option" type="button" data-study-mode-option="two" aria-pressed="false">2 steps: character, then pinyin + meaning</button>
              </div>
            </div>
            <div class="field settings-field-wide">
              <span>Auto-play pronunciation after revealing pinyin</span>
              <div class="theme-switch" role="group" aria-label="Auto-play pronunciation">
                <button class="theme-option" type="button" data-autoplay-option="on" aria-pressed="true">On</button>
                <button class="theme-option" type="button" data-autoplay-option="off" aria-pressed="false">Off</button>
              </div>
            </div>
            <div class="field settings-field-wide">
              <span>Color theme</span>
              <div class="theme-switch" role="group" aria-label="Color theme">
                <button class="theme-option" type="button" data-theme-option="black" aria-pressed="true">Dark mode</button>
                <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false">Light mode</button>
              </div>
            </div>
          </div>
        </section>
      </section>
