        <main class="app">
          <header class="header">
            <p class="eyebrow">Flashcards</p>
            <h1 id="deck-title">Chinese Characters</h1>
            <p class="progress" id="progress">1 / 10</p>
          </header>

          <dl class="stats" aria-label="Deck statistics">
            <div class="stat">
              <dt>Perfect</dt>
              <dd id="stats-perfect">0</dd>
            </div>
            <div class="stat">
              <dt>Know it</dt>
              <dd id="stats-known">0</dd>
            </div>
            <div class="stat">
              <dt>Unseen</dt>
              <dd id="stats-unseen">0</dd>
            </div>
            <div class="stat">
              <dt>Not sure</dt>
              <dd id="stats-unsure">0</dd>
            </div>
            <div class="stat">
              <dt>No idea</dt>
              <dd id="stats-no-idea">0</dd>
            </div>
          </dl>

          <section class="stage" aria-live="polite">
            <aside class="card-tools" aria-label="Flashcard tools">
              <button class="card-tool card-tool-speech" id="speak-btn" type="button" aria-label="Play pronunciation" title="Play pronunciation">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                  <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
                </svg>
              </button>
              <div class="card-tool-item">
                <button class="card-tool" id="sentence-btn" type="button" aria-label="Example sentence" title="Example sentence" aria-expanded="false" aria-describedby="sentence-tooltip" disabled>
                  例
                </button>
                <p class="card-tooltip" id="sentence-tooltip" role="tooltip"></p>
              </div>
              <div class="card-tool-item">
                <button class="card-tool" id="etymology-btn" type="button" aria-label="Character etymology" title="Character etymology" aria-expanded="false" aria-describedby="etymology-tooltip" disabled>
                  源
                </button>
                <p class="card-tooltip" id="etymology-tooltip" role="tooltip"></p>
              </div>
            </aside>
            <button class="card" id="card" type="button" aria-label="Reveal flashcard">
              <span class="card-inner">
                <span class="card-face card-front">
                  <span class="hanzi" id="hanzi">你</span>
                  <span class="hint" id="front-hint">Click to reveal</span>
                </span>
                <span class="card-face card-back">
                  <span class="hanzi hanzi-small" id="hanzi-back">你</span>
                  <span class="phase-label" id="phase-label">Pinyin</span>
                  <span class="pinyin" id="pinyin">nǐ</span>
                  <span class="meaning" id="meaning" hidden>ty</span>
                </span>
              </span>
            </button>
          </section>

          <p class="note" id="note">Try to read the character first.</p>

          <section class="actions" id="actions">
            <button class="btn btn-no" id="unknown-btn" type="button" disabled>Don't know</button>
            <button class="btn btn-yes" id="known-btn" type="button" disabled>Know it</button>
          </section>

          <section class="card-details" id="card-details" hidden>
            <button class="btn btn-yes" id="next-btn" type="button">Next</button>
          </section>

        </main>

        <section class="summary hidden" id="summary" hidden>
          <p class="eyebrow">Session complete</p>
          <h2>Results</h2>
          <p class="score" id="score"></p>
          <div class="summary-actions">
            <button class="btn btn-yes" id="retry-unknown-btn" type="button">Review missed</button>
            <button class="btn btn-ghost" id="restart-btn" type="button">Restart</button>
          </div>
        </section>
      </section>
